name: Windows x64 release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '업로드할 GitHub 릴리즈 태그'
        required: true
        default: 'v1.0.3'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller PySide6 markdown Pygments Pillow pypdf python-docx

      - name: Build Windows x64 executable
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          pyinstaller --clean --noconfirm app.spec
          Compress-Archive -Path dist/app/* -DestinationPath PastelAIStudio-windows-x64-${{ github.event.inputs.release_tag || github.ref_name }}.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: PastelAIStudio-windows-x64-${{ github.event.inputs.release_tag || github.ref_name }}.zip
          fail_on_unmatched_files: true
